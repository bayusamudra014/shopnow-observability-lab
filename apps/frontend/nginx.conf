server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Static assets are fingerprinted by Vite: cache them for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: every other path serves index.html.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }

  location = /health { return 200 "ok\n"; access_log off; }
}
