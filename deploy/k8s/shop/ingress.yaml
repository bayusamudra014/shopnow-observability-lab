apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: shop
spec:
  ingressClassName: nginx
  rules:
    # The storefront and its API
    - host: shop.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api-gateway, port: { number: 80 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
    # Same shop on shop.localhost: browsers resolve *.localhost to 127.0.0.1 by
    # themselves, so this works with `minikube tunnel` even without a hosts entry.
    - host: shop.localhost
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api-gateway, port: { number: 80 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
    # Public endpoint for the external payment provider's webhooks. ONLY /webhooks is
    # exposed on this host, so the provider cannot reach anything else.
    - host: hooks.local
      http:
        paths:
          - path: /webhooks
            pathType: Prefix
            backend:
              service: { name: payment, port: { number: 80 } }
