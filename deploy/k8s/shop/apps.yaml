  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: auth, namespace: shop, labels: { app: auth } }
spec:
  replicas: 1
  selector: { matchLabels: { app: auth } }
  template:
    metadata: { labels: { app: auth } }
    spec:
      containers:
        - name: auth
          image: shop/auth:dev
          imagePullPolicy: Never
          envFrom: [{ configMapRef: { name: shop-common } }]
          env:
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
            - { name: OTEL_SERVICE_NAME, value: auth }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=shop,deployment.environment=minikube,k8s.namespace.name=shop,k8s.deployment.name=auth,k8s.pod.name=$(POD_NAME),k8s.node.name=$(NODE_NAME)" }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: shop-secrets, key: POSTGRES_PASSWORD } } }
            - { name: DATABASE_URL, value: "postgres://shop:$(POSTGRES_PASSWORD)@postgres.infra.svc.cluster.local:5432/auth_db" }
