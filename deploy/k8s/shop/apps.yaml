# Shop microservices. Every Deployment follows the same pattern:
#  - image built straight into minikube's Docker (imagePullPolicy: Never)
#  - OTel resource attributes include pod/node/deployment so SigNoz can group by them
#  - startup probe gives time for migrations and Kafka; readiness checks dependencies
#
# ----------------------------------------------------------------------------- api-gateway
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: shop, labels: { app: api-gateway } }
spec:
  selector: { app: api-gateway }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, namespace: shop, labels: { app: api-gateway } }
spec:
  replicas: 1
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: shop/api-gateway:dev
          imagePullPolicy: Never
          envFrom: [{ configMapRef: { name: shop-common } }]
          env:
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
            - { name: OTEL_SERVICE_NAME, value: api-gateway }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=shop,deployment.environment=minikube,k8s.namespace.name=shop,k8s.deployment.name=api-gateway,k8s.pod.name=$(POD_NAME),k8s.node.name=$(NODE_NAME)" }
            - { name: RATE_LIMIT_PER_MINUTE, value: "600" }
          ports: [{ name: http, containerPort: 8080 }]
          startupProbe: { httpGet: { path: /health, port: http }, periodSeconds: 3, failureThreshold: 60 }
          readinessProbe: { httpGet: { path: /ready, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 20 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 384Mi } }
---
