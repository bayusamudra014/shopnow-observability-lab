# Public entry points of one student VM. minikube publishes the VM's ports 80/443 to the
# ingress controller, so these hosts must resolve (DNS) to the VM's address.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-public
  namespace: shop
spec:
  ingressClassName: nginx
  rules:
    - host: __SHOP_HOST__
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api-gateway, port: { number: 80 } }
          # Webhooks from the shared payment provider. Only /webhooks of the payment
          # service is published; its other endpoints stay cluster-internal.
          - path: /webhooks
            pathType: Prefix
            backend:
              service: { name: payment, port: { number: 80 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
---
apiVersion: networking.k8s.io/v1
