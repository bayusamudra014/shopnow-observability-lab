# Read-only grader for the incident challenges. check.sh / check.ps1 start a Job from this
# (suspended) CronJob and print its output. KIT_* placeholders are filled by the release.
apiVersion: v1
kind: ServiceAccount
metadata: { name: lab-check, namespace: shop }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: shopnow-lab-check }
rules:
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: ["autoscaling"]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
  - apiGroups: ["kafka.strimzi.io"]
    resources: [kafkatopics]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: shopnow-lab-check }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: shopnow-lab-check }
subjects:
  - { kind: ServiceAccount, name: lab-check, namespace: shop }
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: lab-check, namespace: shop }
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 600
      template:
        spec:
          serviceAccountName: lab-check
          restartPolicy: Never
          containers:
            - name: lab-check
              image: KIT_REGISTRY/shopnow-lab-check:KIT_TAG
              imagePullPolicy: IfNotPresent
              env:
                - { name: BAD_TAG, value: KIT_BAD_TAG }
                - { name: SHOP_PUBLIC_URL, valueFrom: { configMapKeyRef: { name: shop-common, key: SHOP_PUBLIC_URL } } }
                - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: shop-secrets, key: POSTGRES_PASSWORD } } }
                - { name: INSTRUCTOR_PASSWORD, valueFrom: { secretKeyRef: { name: shop-secrets, key: INSTRUCTOR_PASSWORD } } }
              resources: { requests: { cpu: 10m, memory: 64Mi }, limits: { memory: 192Mi } }
